name: 问题反馈
description: 集成无法加载、实体异常、控制失败等
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提 issue 前请先确认：已重启 HA、已查看 **设置 → 系统 → 日志** 中 `bull` 相关报错、
        已确认 HA 版本 ≥ 2024.6。
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant 版本
      placeholder: "例如 2025.10.1"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Bull MosHome 版本
      description: HACS 里显示的版本号，或 manifest.json 中的 version
      placeholder: "例如 1.3.1"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: 安装方式
      options:
        - HACS
        - 手动复制 custom_components/bull
        - 从 hass-iotbull 迁移而来
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 发生了什么，期望是什么
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 只贴 `bull` 相关部分，**请先删除账号、密码、token、iotId、设备昵称**
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 日志中已移除账号、token、设备 ID 等隐私信息
          required: true
        - label: 未同时安装 hass-iotbull（两者 domain 相同，不能共存）
          required: true
